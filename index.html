<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA PRINT | Custom 3D Prints</title>

<style>
:root{
  --blue:#1683ff;
  --blue-dark:#0057d9;
  --dark:#07090d;
  --card:#171a20;
  --card2:#20242c;
  --text:#f7f7f8;
  --muted:#b9bdc7;
  --green:#28d17c;
  --red:#ff5b63;
  --gold:#ffd66b;
  --border:#303640;
}

*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:
    radial-gradient(
      circle at 50% -10%,
      #152b48 0%,
      #090b10 42%,
      #06070a 100%
    );
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

.wrap{
  width:min(950px,94%);
  margin:auto;
}

/* =========================
   NOVA PRINT CSS LOGO
   ========================= */

.logo-area{
  text-align:center;
  padding:25px 0 20px;
}

.logo-ring{
  width:min(300px,82vw);
  height:min(300px,82vw);

  margin:auto;

  border-radius:50%;

  border:5px solid var(--blue);

  background:
    radial-gradient(
      circle,
      #182333 0%,
      #0b1018 60%,
      #07090d 100%
    );

  box-shadow:
    0 0 15px rgba(22,131,255,.7),
    0 0 45px rgba(22,131,255,.25),
    inset 0 0 30px rgba(22,131,255,.15);

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;

  position:relative;

  overflow:hidden;
}

.logo-ring::before{
  content:"";

  position:absolute;

  width:80%;
  height:2px;

  background:var(--blue);

  opacity:.5;

  top:50%;
  left:10%;

  box-shadow:
    0 -80px 0 rgba(22,131,255,.15),
    0 80px 0 rgba(22,131,255,.15);
}

/* 3D CUBE */

.logo-cube{
  width:70px;
  height:70px;

  position:relative;

  transform:rotate(-30deg) skewY(10deg);

  margin-bottom:12px;

  z-index:2;
}

.cube-top,
.cube-left,
.cube-right{
  position:absolute;
  width:50px;
  height:50px;
  border:2px solid #55aaff;
}

.cube-top{
  left:10px;
  top:0;

  background:#247fd8;

  transform:skewX(-30deg) scaleY(.58);
}

.cube-left{
  left:0;
  top:27px;

  background:#0e4f99;

  transform:skewY(30deg) scaleX(.58);
}

.cube-right{
  left:35px;
  top:27px;

  background:#176dcc;

  transform:skewY(-30deg) scaleX(.58);
}

/* WORDMARK */

.logo-nova{
  position:relative;
  z-index:3;

  font-size:clamp(2.5rem,10vw,4.2rem);

  line-height:.9;

  font-weight:1000;

  letter-spacing:5px;

  color:white;

  text-shadow:
    0 0 8px rgba(255,255,255,.15),
    0 0 20px rgba(22,131,255,.3);
}

.logo-nova span{
  color:var(--blue);
}

.logo-print{
  position:relative;
  z-index:3;

  margin-top:8px;

  color:#66b0ff;

  font-size:clamp(.9rem,3vw,1.3rem);

  font-weight:900;

  letter-spacing:8px;
}

.logo-lines{
  display:flex;
  align-items:center;
  gap:8px;

  margin-top:9px;
}

.logo-lines span{
  width:35px;
  height:3px;
  background:var(--blue);
}

.logo-tagline{
  margin:12px 0 0;

  color:var(--muted);

  font-size:.9rem;

  letter-spacing:.5px;
}

/* =========================
   CASH NOTICE
   ========================= */

.cash{
  margin:22px 0;

  padding:20px;

  text-align:center;

  border:2px solid #c99524;

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      #2b2413,
      #18150d
    );
}

.cash-title{
  color:var(--gold);

  font-size:1.35rem;

  font-weight:900;

  margin-bottom:7px;
}

.cash-text{
  color:#eee0ba;
}

/* =========================
   CARDS
   ========================= */

.card{
  background:rgba(23,26,32,.97);

  border:1px solid var(--border);

  border-radius:18px;

  padding:20px;

  margin:18px 0;

  box-shadow:
    0 12px 35px rgba(0,0,0,.25);
}

h2{
  margin:0 0 18px;

  font-size:1.3rem;
}

.step{
  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:34px;
  height:34px;

  margin-right:7px;

  border-radius:50%;

  background:var(--blue);

  font-weight:900;
}

/* =========================
   PRODUCTS
   ========================= */

.products{
  display:grid;

  grid-template-columns:
    repeat(
      auto-fit,
      minmax(190px,1fr)
    );

  gap:12px;
}

.product{
  display:block;

  padding:17px;

  background:var(--card2);

  border:2px solid var(--border);

  border-radius:14px;

  cursor:pointer;

  transition:.15s;
}

.product:hover{
  border-color:#527fbf;

  transform:translateY(-2px);
}

.product.selected{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(20,124,255,.15);
}

.product input{
  display:none;
}

.product-name{
  font-size:1.05rem;

  font-weight:900;
}

.price{
  color:#72b1ff;

  font-size:1.05rem;

  font-weight:900;

  margin-top:7px;
}

.stock{
  color:var(--muted);

  margin-top:6px;

  font-size:.85rem;
}

/* =========================
   FORM
   ========================= */

label{
  display:block;

  margin:14px 0 7px;

  font-weight:800;
}

.required{
  color:#ff858b;
}

input,
select,
textarea{
  width:100%;

  padding:13px;

  border-radius:11px;

  border:1px solid #3a3e47;

  background:#0f1115;

  color:white;

  font:inherit;

  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--blue);

  box-shadow:
    0 0 0 3px
    rgba(20,124,255,.12);
}

textarea{
  min-height:110px;

  resize:vertical;
}

.grid{
  display:grid;

  grid-template-columns:1fr 1fr;

  gap:14px;
}

.hint{
  color:var(--muted);

  font-size:.85rem;

  margin-top:6px;
}

/* =========================
   CART
   ========================= */

.cart-item{
  background:#111318;

  border:1px solid var(--border);

  border-radius:13px;

  padding:14px;

  margin-bottom:10px;
}

.cart-title{
  font-weight:900;
}

.cart-details{
  color:var(--muted);

  line-height:1.55;

  font-size:.9rem;

  margin-top:5px;
}

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NOVA PRINT — Custom 3D Prints</title>

<meta name="description"
content="NOVA PRINT custom 3D printing order form. Cash only.">

<style>
:root {
  --blue:#147cff;
  --blue2:#0057d9;
  --dark:#101114;
  --card:#181a1f;
  --card2:#20232a;
  --text:#f7f7f8;
  --muted:#b9bdc7;
  --green:#28d17c;
  --red:#ff5b63;
  --border:#30343d;
}

* {
  box-sizing:border-box;
}

body {
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:
    linear-gradient(
      180deg,
      #090a0c 0%,
      #111318 45%,
      #090a0c 100%
    );
  color:var(--text);
}

.wrap {
  width:min(980px,94%);
  margin:auto;
}

/* HEADER */

header {
  padding:22px 0 18px;
  text-align:center;
  border-bottom:1px solid #24272e;
}

.logo {
  display:block;
  width:min(330px,82vw);
  max-height:330px;
  object-fit:contain;
  margin:0 auto 8px;
  filter:drop-shadow(0 0 18px rgba(20,124,255,.25));
}

.tagline {
  color:var(--muted);
  margin:0;
  font-size:1rem;
}

/* CASH NOTICE */

.cash {
  margin:22px auto;
  padding:18px;

  border:2px solid #c99524;

  background:
    linear-gradient(
      135deg,
      #2b2413,
      #18150d
    );

  border-radius:16px;
  text-align:center;
}

.cash strong {
  display:block;
  font-size:1.25rem;
  margin-bottom:6px;
  color:#ffd66b;
}

.cash span {
  color:#eee0ba;
}

/* CARDS */

.card {
  background:rgba(24,26,31,.96);

  border:1px solid var(--border);

  border-radius:18px;

  padding:20px;

  margin:18px 0;

  box-shadow:
    0 12px 35px rgba(0,0,0,.22);
}

h2 {
  margin:0 0 16px;
  font-size:1.35rem;
}

.step {
  display:inline-flex;

  align-items:center;
  justify-content:center;

  width:32px;
  height:32px;

  border-radius:50%;

  background:var(--blue);

  margin-right:8px;

  font-weight:800;
}

.products {

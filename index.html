<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NOVA PRINT</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f4f4f5;color:#18181b}
header{background:#18181b;color:#fff;padding:28px 16px;text-align:center}
header h1{margin:0;font-size:34px} header p{margin:8px 0 0;color:#d4d4d8}
main{max-width:950px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:20px;margin-bottom:18px;box-shadow:0 3px 15px #0001}
h2{margin-top:0}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}
.product{border:1px solid #e4e4e7;border-radius:15px;padding:16px}
.product h3{margin:0 0 8px}.price{font-size:20px;font-weight:bold;margin:10px 0}
label{display:block;font-weight:bold;margin:14px 0 6px}
select,input,textarea,button{width:100%;padding:12px;border-radius:10px;border:1px solid #d4d4d8;font-size:16px}
textarea{min-height:90px;resize:vertical}
button{background:#18181b;color:white;border:0;font-weight:bold;cursor:pointer;margin-top:12px}
button:hover{opacity:.9}
.drop{border:2px dashed #a1a1aa;border-radius:15px;padding:20px;text-align:center;cursor:pointer;background:#fafafa}
.drop.drag{background:#e4e4e7}.drop strong{display:block;font-size:17px;margin-bottom:6px}
.fileInput{display:none}.fileName{margin-top:8px;font-size:13px;color:#52525b;word-break:break-word}
.cart-item{padding:12px 0;border-bottom:1px solid #e4e4e7}
.total{font-size:21px;font-weight:bold;margin-top:15px}
.note{font-size:13px;color:#71717a}
.empty{color:#71717a}
.status{margin-top:12px;padding:12px;border-radius:10px;background:#f4f4f5}
</style>
</head>
<body>
<header>
  <h1>NOVA PRINT</h1>
  <p>Custom 3D prints made your way.</p>
</header>

<main>
<form id="orderForm"
      action="https://formsubmit.co/cannonkidd.m@gmail.com"
      method="POST"
      enctype="multipart/form-data">

  <input type="hidden" name="_subject" value="New NOVA PRINT order">
  <input type="hidden" name="_template" value="table">
  <input type="hidden" name="_captcha" value="true">
  <input type="hidden" name="Order_Summary" id="orderSummary">

  <section class="card">
    <h2>🖨️ Choose a Print</h2>
    <div class="products" id="products"></div>
  </section>

  <section class="card">
    <h2>🛒 Your Cart</h2>
    <div id="cart"><p class="empty">Your cart is empty.</p></div>
    <div class="total" id="total"></div>
  </section>

  <section class="card">
    <h2>📩 Send Your Order</h2>

    <label for="customerName">Your name</label>
    <input id="customerName" name="Customer_Name" required>

    <label for="customerEmail">Your email</label>
    <input id="customerEmail" type="email" name="Customer_Email" required>

    <label for="customerAddress">Shipping / Delivery Address</label>
    <textarea id="customerAddress" name="Shipping_Address" required
      placeholder="Street address, city, state, ZIP code"></textarea>

    <button type="submit">Send Order</button>
    <p class="note">Your order details and attached 3D files will be sent to NOVA PRINT.</p>
    <div id="status" class="status" style="display:none"></div>
  </section>
</form>
</main>

<script>
/* ==========================
   NOVA PRINT INVENTORY
   Change stock/prices here for now.
   ========================== */
const inventory = {
  colors: {
    "Black": 20,
    "White": 15,
    "Red": 8,
    "Blue": 0,
    "Green": 5,
    "Purple": 3
  },
  finishes: {
    "Smooth": 1.00,
    "Textured": 1.25
  },
  products: [
    {name:"Custom Figure", price:10},
    {name:"Keychain", price:4},
    {name:"Small Decoration", price:7},
    {name:"Custom Part", price:12}
  ]
};

let cart=[];

function renderProducts(){
  const box=document.getElementById("products");
  box.innerHTML="";

  inventory.products.forEach((p,i)=>{
    const colors=Object.entries(inventory.colors)
      .filter(([name,qty])=>qty>0)
      .map(([name])=>`<option value="${name}">${name}</option>`)
      .join("");

    box.innerHTML += `
      <div class="product">
        <h3>${p.name}</h3>
        <div class="price">$${p.price.toFixed(2)}</div>

        <label for="color${i}">Color</label>
        <select id="color${i}">${colors || '<option>No colors in stock</option>'}</select>

        <label for="finish${i}">Finish</label>
        <select id="finish${i}">
          <option>Smooth</option>
          <option>Textured</option>
        </select>

        <label for="desc${i}">How do you want it?</label>
        <textarea id="desc${i}" placeholder="For a keychain, type the name/text, shape, design, size, or anything else you want."></textarea>

        <label for="qty${i}">Quantity</label>
        <input id="qty${i}" type="number" min="1" value="1">

        <label>3D File (optional)</label>
        <div class="drop" id="drop${i}">
          <strong>📁 Drop your file here</strong>
          <span>or tap to choose a file</span>
          <div class="fileName" id="fileName${i}">No file selected</div>
          <input class="fileInput" id="file${i}" type="file"
                 name="3D_File_${i+1}"
                 accept=".stl,.3mf,.obj,.step,.stp">
        </div>

        <button type="button" onclick="addToCart(${i})">Add to Cart</button>
      </div>`;
  });

  inventory.products.forEach((p,i)=>setupDrop(i));
}

function setupDrop(i){
  const drop=document.getElementById("drop"+i);
  const input=document.getElementById("file"+i);

  drop.addEventListener("click",()=>input.click());
  drop.addEventListener("dragover",e=>{
    e.preventDefault();
    drop.classList.add("drag");
  });
  drop.addEventListener("dragleave",()=>drop.classList.remove("drag"));
  drop.addEventListener("drop",e=>{
    e.preventDefault();
    drop.classList.remove("drag");
    if(e.dataTransfer.files.length){
      input.files=e.dataTransfer.files;
      showFile(i);
    }
  });
  input.addEventListener("change",()=>showFile(i));
}

function showFile(i){
  const f=document.getElementById("file"+i).files[0];
  document.getElementById("fileName"+i).textContent =
    f ? `${f.name} (${(f.size/1024/1024).toFixed(2)} MB)` : "No file selected";
}

function addToCart(i){
  const p=inventory.products[i];
  const color=document.getElementById("color"+i).value;
  const finish=document.getElementById("finish"+i).value;
  const description=document.getElementById("desc"+i).value.trim();
  const qty=Math.max(1,parseInt(document.getElementById("qty"+i).value)||1);
  const file=document.getElementById("file"+i).files[0] || null;

  if(!color || inventory.colors[color]<=0){
    alert("That color is out of stock.");
    return;
  }
  if(qty>inventory.colors[color]){
    alert(`Only ${inventory.colors[color]} of ${color} are in stock.`);
    return;
  }
  if(!description){
    alert("Please describe how you want this item made.");
    document.getElementById("desc"+i).focus();
    return;
  }
  if(file && file.size>10*1024*1024){
    alert("That file is over 10 MB. Please choose a smaller file.");
    return;
  }

  cart.push({
    name:p.name,
    color,
    finish,
    description,
    qty,
    price:p.price*inventory.finishes[finish],
    fileName:file ? file.name : ""
  });

  renderCart();
}

function escapeHtml(s){
  return s.replace(/[&<>"']/g,c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function renderCart(){
  const box=document.getElementById("cart");
  const totalEl=document.getElementById("total");

  if(!cart.length){
    box.innerHTML='<p class="empty">Your cart is empty.</p>';
    totalEl.textContent="";
    return;
  }

  let total=0;
  box.innerHTML=cart.map((x,i)=>{
    const line=x.price*x.qty;
    total+=line;
    return `<div class="cart-item">
      <b>${escapeHtml(x.name)}</b> — ${escapeHtml(x.color)}, ${escapeHtml(x.finish)} × ${x.qty}
      <br>📝 ${escapeHtml(x.description)}
      ${x.fileName ? `<br>📎 ${escapeHtml(x.fileName)}` : ""}
      <br>$${line.toFixed(2)}
      <button type="button" onclick="removeItem(${i})">Remove</button>
    </div>`;
  }).join("");

  totalEl.textContent="Total: $"+total.toFixed(2);
}

function removeItem(i){
  cart.splice(i,1);
  renderCart();
}

document.getElementById("orderForm").addEventListener("submit",function(e){
  if(!cart.length){
    e.preventDefault();
    alert("Please add at least one item to your cart.");
    return;
  }

  let summary="";
  cart.forEach((x,n)=>{
    summary += `Item ${n+1}: ${x.name}\n`;
    summary += `Color: ${x.color}\n`;
    summary += `Finish: ${x.finish}\n`;
    summary += `Quantity: ${x.qty}\n`;
    summary += `How they want it: ${x.description}\n`;
    summary += `File: ${x.fileName || "No file"}\n`;
    summary += `Price: $${(x.price*x.qty).toFixed(2)}\n\n`;
  });

  const total=cart.reduce((sum,x)=>sum+x.price*x.qty,0);
  summary += `Total: $${total.toFixed(2)}`;
  document.getElementById("orderSummary").value=summary;
});

renderProducts();
renderCart();
</script>
</body>
</html>
